<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حساب جديد - شارك سيارتك</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <i class="fas fa-car"></i>
                    <span>شارك سيارتك</span>
                </div>
                <div class="nav-buttons">
                    <a href="index.html" class="btn btn-outline">
                        <i class="fas fa-arrow-right"></i>
                        العودة للرئيسية
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Registration Section -->
    <section class="register-section">
        <div class="container">
            <div class="register-container">
                <div class="register-header">
                    <h1>سجل حسابك الجديد</h1>
                    <p>انضم إلى منصتنا وابدأ في تأجير سيارتك</p>
                </div>
                
                <form class="register-form" id="registerForm">
                    <!-- User Type Selection -->
                    <div class="user-type-selector">
                        <div class="type-option active" data-type="renter">
                            <div class="type-icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="type-content">
                                <h3>مستأجر</h3>
                                <p>أريد استئجار سيارة</p>
                            </div>
                        </div>
                        <div class="type-option" data-type="owner">
                            <div class="type-icon">
                                <i class="fas fa-car"></i>
                            </div>
                            <div class="type-content">
                                <h3>صاحب سيارة</h3>
                                <p>أريد تأجير سيارتي</p>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="fullName">الاسم الكامل</label>
                        <div class="input-group">
                            <i class="fas fa-user"></i>
                            <input type="text" id="fullName" name="fullName" required placeholder="أدخل اسمك الكامل">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">البريد الإلكتروني</label>
                        <div class="input-group">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" name="email" required placeholder="أدخل بريدك الإلكتروني">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">رقم الهاتف</label>
                        <div class="input-group">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="phone" name="phone" required placeholder="أدخل رقم هاتفك">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">كلمة المرور</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" name="password" required placeholder="أدخل كلمة المرور">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">تأكيد كلمة المرور</label>
                        <div class="input-group">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="أعد إدخال كلمة المرور">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="city">المدينة</label>
                        <div class="input-group">
                            <i class="fas fa-map-marker-alt"></i>
                            <select id="city" name="city" required>
                                <option value="">اختر المدينة</option>
                                <option value="الرياض">الرياض</option>
                                <option value="جدة">جدة</option>
                                <option value="الدمام">الدمام</option>
                                <option value="مكة">مكة</option>
                                <option value="المدينة">المدينة</option>
                                <option value="الطائف">الطائف</option>
                                <option value="تبوك">تبوك</option>
                                <option value="أبها">أبها</option>
                                <option value="حائل">حائل</option>
                                <option value="بريدة">بريدة</option>
                                <option value="خميس مشيط">خميس مشيط</option>
                                <option value="الظهران">الظهران</option>
                                <option value="الخبر">الخبر</option>
                                <option value="الجبيل">الجبيل</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" name="terms" required>
                            <span class="checkmark"></span>
                            أوافق على <a href="#" class="terms-link">الشروط والأحكام</a> و <a href="#" class="privacy-link">سياسة الخصوصية</a>
                        </label>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="newsletter" name="newsletter">
                            <span class="checkmark"></span>
                            أريد استلام النشرات الإخبارية والعروض الخاصة
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary register-btn">
                        <i class="fas fa-user-plus"></i>
                        إنشاء الحساب
                    </button>
                </form>

                <div class="login-link">
                    <p>لديك حساب بالفعل؟ <a href="login-firebase.html">تسجيل الدخول</a></p>
                </div>

                <!-- Message Container -->
                <div id="messageContainer" class="message-container" style="display: none;">
                    <div class="message-content">
                        <i class="message-icon"></i>
                        <span class="message-text"></span>
                    </div>
                </div>

                <!-- Loading Overlay -->
                <div id="loadingOverlay" class="loading-overlay" style="display: none;">
                    <div class="loading-content">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>جاري إنشاء الحساب...</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <div class="footer-logo">
                        <i class="fas fa-car"></i>
                        <span>شارك سيارتك</span>
                    </div>
                    <p>منصة آمنة وموثوقة لتأجير السيارات من شخص لشخص</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2024 شارك سيارتك. جميع الحقوق محفوظة.</p>
            </div>
        </div>
    </footer>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Supabase Service -->
    <script src="supabase-service.js"></script>
    
    <script>
        // Registration page functionality - Updated to use Firebase
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('registerForm');
            const inputs = document.querySelectorAll('.input-group input, .input-group select');
            const userTypeOptions = document.querySelectorAll('.type-option');
            
            let selectedUserType = 'renter'; // Default selection

            // User type selection
            userTypeOptions.forEach(option => {
                option.addEventListener('click', function() {
                    // Remove active class from all options
                    userTypeOptions.forEach(opt => opt.classList.remove('active'));
                    // Add active class to clicked option
                    this.classList.add('active');
                    // Update selected user type
                    selectedUserType = this.dataset.type;
                });
            });
            
            // Form validation
            function validateForm() {
                let isValid = true;
                
                // Clear previous error states
                inputs.forEach(input => {
                    input.classList.remove('error');
                });
                
                // Validate full name
                const fullName = document.getElementById('fullName');
                if (fullName.value.trim().length < 3) {
                    fullName.classList.add('error');
                    isValid = false;
                }
                
                // Validate email
                const email = document.getElementById('email');
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email.value)) {
                    email.classList.add('error');
                    isValid = false;
                }
                
                // Validate phone
                const phone = document.getElementById('phone');
                const phoneRegex = /^[0-9+\-\s()]{10,}$/;
                if (!phoneRegex.test(phone.value)) {
                    phone.classList.add('error');
                    isValid = false;
                }
                
                // Validate password
                const password = document.getElementById('password');
                if (password.value.length < 6) {
                    password.classList.add('error');
                    isValid = false;
                }
                
                // Validate confirm password
                const confirmPassword = document.getElementById('confirmPassword');
                if (confirmPassword.value !== password.value) {
                    confirmPassword.classList.add('error');
                    isValid = false;
                }
                
                // Validate city
                const city = document.getElementById('city');
                if (!city.value) {
                    city.classList.add('error');
                    isValid = false;
                }
                
                // Validate terms
                const terms = document.getElementById('terms');
                if (!terms.checked) {
                    terms.parentElement.style.color = '#ef4444';
                    isValid = false;
                } else {
                    terms.parentElement.style.color = '#374151';
                }
                
                return isValid;
            }
            
            // Real-time validation
            inputs.forEach(input => {
                input.addEventListener('blur', function() {
                    validateField(this);
                });
                
                input.addEventListener('input', function() {
                    if (this.classList.contains('error')) {
                        validateField(this);
                    }
                });
            });
            
            function validateField(field) {
                const value = field.value.trim();
                const fieldName = field.name;
                
                // Clear error state
                field.classList.remove('error');
                
                // Validate based on field type
                switch (fieldName) {
                    case 'fullName':
                        if (value.length < 3) {
                            field.classList.add('error');
                        }
                        break;
                    case 'email':
                        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                        if (!emailRegex.test(value)) {
                            field.classList.add('error');
                        }
                        break;
                    case 'phone':
                        const phoneRegex = /^[0-9+\-\s()]{10,}$/;
                        if (!phoneRegex.test(value)) {
                            field.classList.add('error');
                        }
                        break;
                    case 'password':
                        if (value.length < 6) {
                            field.classList.add('error');
                        }
                        break;
                    case 'confirmPassword':
                        const password = document.getElementById('password').value;
                        if (value !== password) {
                            field.classList.add('error');
                        }
                        break;
                }
            }
            
            // Handle form submission
            registerForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                if (!validateForm()) {
                    showMessage('يرجى تصحيح الأخطاء في النموذج', 'error');
                    return;
                }
                
                // Show loading
                showLoading(true);
                
                try {
                    // Get form data
                    const formData = new FormData(registerForm);
                    const userData = {
                        full_name: formData.get('fullName').trim(),
                        email: formData.get('email').trim(),
                        phone: formData.get('phone').trim(),
                        city: formData.get('city'),
                        user_type: selectedUserType,
                        password: formData.get('password'),
                        newsletter: formData.get('newsletter') === 'on'
                    };
                    
                    // Try Supabase first, fallback to localStorage
                    let result = null;
                    let useSupabase = false;
                    
                    try {
                        // Check if Supabase is available and working
                        if (window.supabaseService && typeof window.supabaseService.registerUser === 'function') {
                            result = await supabaseService.registerUser(userData);
                            useSupabase = true;
                        } else {
                            throw new Error('Supabase not available');
                        }
                    } catch (supabaseError) {
                        console.log('Supabase not available, using localStorage fallback');
                        // Fallback to localStorage
                        result = await registerUserLocalStorage(userData);
                        useSupabase = false;
                    }
                    
                    if (result) {
                        showMessage('تم إنشاء الحساب بنجاح!', 'success');
                        
                        // Store user info in session storage for quick access
                        if (useSupabase) {
                            sessionStorage.setItem('currentUser', JSON.stringify({
                                uid: result.user.id,
                                email: result.profile.email,
                                full_name: result.profile.full_name,
                                user_type: result.profile.user_type
                            }));
                        } else {
                            sessionStorage.setItem('currentUser', JSON.stringify({
                                uid: result.id,
                                email: result.email,
                                full_name: result.full_name,
                                user_type: result.user_type
                            }));
                        }
                        
                        // Redirect based on user type
                        setTimeout(() => {
                            if (selectedUserType === 'owner') {
                                window.location.href = 'dashboard.html';
                            } else {
                                window.location.href = 'index.html';
                            }
                        }, 2000);
                        
                    } else {
                        showMessage('فشل في إنشاء الحساب', 'error');
                    }
                    
                } catch (error) {
                    console.error('Registration error:', error);
                    
                    let errorMessage = 'حدث خطأ في إنشاء الحساب';
                    
                    // Handle specific Supabase auth errors
                    if (error.message) {
                        if (error.message.includes('User already registered')) {
                            errorMessage = 'البريد الإلكتروني مستخدم بالفعل';
                        } else if (error.message.includes('Invalid email')) {
                            errorMessage = 'البريد الإلكتروني غير صحيح';
                        } else if (error.message.includes('Password should be at least')) {
                            errorMessage = 'كلمة المرور ضعيفة جداً';
                        } else if (error.message.includes('Signup is disabled')) {
                            errorMessage = 'إنشاء الحساب غير مسموح حالياً';
                        } else if (error.message.includes('البريد الإلكتروني مستخدم بالفعل')) {
                            errorMessage = error.message;
                        } else if (error.message.includes('Supabase not available')) {
                            errorMessage = 'جاري استخدام النظام المحلي...';
                        } else {
                            errorMessage = error.message;
                        }
                    }
                    
                    showMessage(errorMessage, 'error');
                } finally {
                    showLoading(false);
                }
            });
            
            // Show message
            function showMessage(message, type) {
                const messageContainer = document.getElementById('messageContainer');
                const messageText = messageContainer.querySelector('.message-text');
                const messageIcon = messageContainer.querySelector('.message-icon');
                
                messageText.textContent = message;
                
                // Set icon and class based on type
                messageContainer.className = `message-container ${type}`;
                
                switch (type) {
                    case 'success':
                        messageIcon.className = 'fas fa-check-circle';
                        break;
                    case 'error':
                        messageIcon.className = 'fas fa-exclamation-circle';
                        break;
                    case 'warning':
                        messageIcon.className = 'fas fa-exclamation-triangle';
                        break;
                    default:
                        messageIcon.className = 'fas fa-info-circle';
                }
                
                messageContainer.style.display = 'block';
                
                // Auto hide after 5 seconds
                setTimeout(() => {
                    messageContainer.style.display = 'none';
                }, 5000);
            }
            
            // Show/hide loading
            function showLoading(show) {
                const loadingOverlay = document.getElementById('loadingOverlay');
                loadingOverlay.style.display = show ? 'flex' : 'none';
            }
            
            // localStorage fallback registration function
            async function registerUserLocalStorage(userData) {
                try {
                    // Check if email already exists
                    const existingUsers = JSON.parse(localStorage.getItem('mockUsers') || '[]');
                    const emailExists = existingUsers.find(user => user.email === userData.email);
                    
                    if (emailExists) {
                        throw new Error('البريد الإلكتروني مستخدم بالفعل');
                    }
                    
                    // Create user object
                    const newUser = {
                        id: 'user-' + Date.now(),
                        full_name: userData.full_name,
                        email: userData.email,
                        phone: userData.phone,
                        city: userData.city,
                        password: userData.password,
                        user_type: userData.user_type,
                        created_at: new Date().toISOString(),
                        is_active: true
                    };
                    
                    // Add user to localStorage
                    existingUsers.push(newUser);
                    localStorage.setItem('mockUsers', JSON.stringify(existingUsers));
                    
                    // Create mock token
                    const token = 'mock-token-' + Date.now();
                    localStorage.setItem('userToken', token);
                    localStorage.setItem('userData', JSON.stringify(newUser));
                    localStorage.setItem('userType', userData.user_type);
                    
                    // Create sample data for the new user
                    createSampleDataForUser(newUser.id, userData.user_type);
                    
                    console.log('✅ User registered successfully with localStorage:', newUser.id);
                    return newUser;
                    
                } catch (error) {
                    console.error('❌ localStorage registration failed:', error);
                    throw error;
                }
            }
            
            // Create sample data for new user
            function createSampleDataForUser(userId, userType) {
                try {
                    console.log('🔧 Creating sample data for new user:', userId, userType);
                    
                    if (userType === 'owner') {
                        // Create sample cars for car owner
                        const sampleCars = [
                            {
                                id: 'car-' + Date.now(),
                                owner_id: userId,
                                brand: 'تويوتا',
                                model: 'كامري',
                                year: '2023',
                                color: 'أبيض',
                                transmission: 'أوتوماتيك',
                                fuel_type: 'بنزين',
                                daily_rate: 200,
                                location: 'الرياض',
                                description: 'سيارة فاخرة ومريحة للرحلات الطويلة',
                                features: ['مكيف', 'نظام صوت', 'كاميرا خلفية', 'ABS'],
                                photos: [],
                                is_available: true,
                                created_at: new Date().toISOString()
                            }
                        ];
                        
                        // Save sample cars
                        const existingCars = JSON.parse(localStorage.getItem('mockCars') || '[]');
                        existingCars.push(...sampleCars);
                        localStorage.setItem('mockCars', JSON.stringify(existingCars));
                        
                    } else {
                        // Create sample bookings for renter
                        const sampleBookings = [
                            {
                                id: 'booking-' + Date.now(),
                                car_id: 'sample-car',
                                car_name: 'هونداي أكسنت 2022',
                                renter_id: userId,
                                renter_name: document.getElementById('fullName').value,
                                owner_id: 'sample-owner',
                                start_date: '2024-01-20',
                                end_date: '2024-01-22',
                                status: 'approved',
                                total_amount: 300,
                                daily_rate: 100,
                                created_at: new Date(Date.now() - 1000 * 60 * 60 * 48).toISOString()
                            }
                        ];
                        
                        // Save sample bookings
                        const existingBookings = JSON.parse(localStorage.getItem('mockBookings') || '[]');
                        existingBookings.push(...sampleBookings);
                        localStorage.setItem('mockBookings', JSON.stringify(existingBookings));
                    }
                    
                    // Create sample notifications
                    const sampleNotifications = [
                        {
                            id: 'notification-' + Date.now(),
                            user_id: userId,
                            type: 'welcome',
                            title: 'مرحباً بك في منصة شارك سيارتك!',
                            description: 'شكراً لك على الانضمام إلينا. نتمنى لك تجربة ممتعة!',
                            is_read: false,
                            created_at: new Date().toISOString()
                        }
                    ];
                    
                    // Save sample notifications
                    const existingNotifications = JSON.parse(localStorage.getItem('mockNotifications') || '[]');
                    existingNotifications.push(...sampleNotifications);
                    localStorage.setItem('mockNotifications', JSON.stringify(existingNotifications));
                    
                    console.log('✅ Sample data created successfully for user:', userId);
                    
                } catch (error) {
                    console.error('❌ Error creating sample data:', error);
                }
            }
        });
    </script>

    <style>
        .message-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            max-width: 400px;
        }

        .message-container.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .message-container.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .message-container.warning {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #f59e0b;
        }

        .message-container.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #3b82f6;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .loading-content i {
            font-size: 2rem;
            color: #3498db;
            margin-bottom: 1rem;
        }

        .loading-content p {
            color: #2c3e50;
            margin: 0;
        }
    </style>
</body>
</html>
